# ==============================================================================
# Air-Gap Container Images Inventory
# ==============================================================================
# This file defines all platform container images needed for offline operation.
# The bundling script (airgap/bundle-offline-assets.sh) reads this file, pulls
# each image on an internet-connected machine, and exports them into:
#   airgap/airgap-images.tar
#
# ------------------------------------------------------------------------------
# 💡 HOW TO IDENTIFY EXACT IMAGE NAMES & TAGS IN THE FUTURE:
# ------------------------------------------------------------------------------
# 1. From a Running Kubernetes Cluster (e.g. your local KinD test cluster):
#    Run this one-liner to list all unique images currently running:
#      kubectl get pods -A -o jsonpath='{range .items[*].spec.containers[*]}{.image}{"\n"}{end}{range .items[*].spec.initContainers[*]}{.image}{"\n"}{end}' | sort -u
#
# 2. From a Helm Chart (.tgz or repo) BEFORE installing:
#    Render the chart templates to stdout and extract the image lines:
#      helm template ./airgap/charts/traefik-41.6.0.tgz | grep -E 'image:\s*"?([^"[:space:]]+)'
#      helm template ./airgap/charts/cert-manager-v1.21.2.tgz | grep -E 'image:\s*"?([^"[:space:]]+)'
#
# 3. From Static Manifest YAMLs (e.g. Argo CD install.yaml):
#    Extract all container and initContainer image references:
#      grep -E 'image:\s*"?([^"[:space:]]+)' 06-argocd/argocd-install-v3.5.3.yaml | sed -E 's/.*image:\s*"?([^"[:space:]]+)"?.*/\1/' | sort -u
#
# 4. Check Helm Chart 'values.yaml' directly:
#    Inspect the 'image:' section in values.yaml:
#      image:
#        repository: <repo>
#        tag: <tag> (or Chart.appVersion)
# ==============================================================================

images:
  # ----------------------------------------------------------------------------
  # 1. Ingress & Gateway API Controller (Step 02: 02-traefik-controller)
  # ----------------------------------------------------------------------------
  - component: traefik-gateway-controller
    description: "Traefik v3.7 gateway controller (DaemonSet on host ports 80/443)"
    image: docker.io/traefik:v3.7.13

  # ----------------------------------------------------------------------------
  # 2. Certificate Management (Step 03: 03-cert-manager)
  # ----------------------------------------------------------------------------
  - component: cert-manager-controller
    description: "Core controller for issuing and managing TLS certificates"
    image: quay.io/jetstack/cert-manager-controller:v1.21.2

  - component: cert-manager-cainjector
    description: "Injects CA bundles into admission webhooks and CRDs"
    image: quay.io/jetstack/cert-manager-cainjector:v1.21.2

  - component: cert-manager-webhook
    description: "Validating and mutating webhook for certificate requests"
    image: quay.io/jetstack/cert-manager-webhook:v1.21.2

  - component: cert-manager-startupapicheck
    description: "Helm post-install validation hook for cert-manager API"
    image: quay.io/jetstack/cert-manager-startupapicheck:v1.21.2

  # ----------------------------------------------------------------------------
  # 3. Cluster Metrics & Autoscaling (Step 05: 05-infra-apps/02-metrics-server)
  # ----------------------------------------------------------------------------
  - component: metrics-server
    description: "Supplies CPU/Memory resource metrics for 'kubectl top' and HPA"
    image: registry.k8s.io/metrics-server/metrics-server:v0.9.0

  # ----------------------------------------------------------------------------
  # 4. GitOps Core - Argo CD v3.5.3 (Step 06: 06-argocd)
  # ----------------------------------------------------------------------------
  - component: argocd
    description: "Argo CD core (server, application-controller, repo-server, and in-cluster chart server)"
    image: quay.io/argoproj/argocd:v3.5.3

  - component: dex
    description: "Argo CD identity provider for SSO / OIDC authentication"
    image: ghcr.io/dexidp/dex:v2.45.1

  - component: redis
    description: "Argo CD in-memory state and application manifest cache"
    image: public.ecr.aws/docker/library/redis:8.2.3-alpine

  # ----------------------------------------------------------------------------
  # 5. Container Registry - Harbor v2.15.2 (Step 05: 05-infra-apps/03-harbor)
  # ----------------------------------------------------------------------------
  - component: harbor-core
    description: "Harbor core service (API, auth, project management, and token service)"
    image: docker.io/goharbor/harbor-core:v2.15.2

  - component: harbor-portal
    description: "Harbor web portal frontend"
    image: docker.io/goharbor/harbor-portal:v2.15.2

  - component: harbor-jobservice
    description: "Harbor asynchronous job and task scheduler"
    image: docker.io/goharbor/harbor-jobservice:v2.15.2

  - component: harbor-registry
    description: "OCI / Docker distribution registry backend"
    image: docker.io/goharbor/registry-photon:v2.15.2

  - component: harbor-registryctl
    description: "Harbor registry controller for garbage collection and health checks"
    image: docker.io/goharbor/harbor-registryctl:v2.15.2

  - component: harbor-database
    description: "Harbor internal PostgreSQL metadata database"
    image: docker.io/goharbor/harbor-db:v2.15.2

  - component: harbor-redis
    description: "Harbor internal Valkey/Redis cache and queue"
    image: docker.io/goharbor/valkey-photon:v2.15.2

  - component: harbor-trivy
    description: "Harbor Trivy vulnerability scanner adapter"
    image: docker.io/goharbor/trivy-adapter-photon:v2.15.2

  # ----------------------------------------------------------------------------
  # 6. Git Service - Forgejo v15.0.10 (Step 05: 05-infra-apps/04-forgejo)
  # ----------------------------------------------------------------------------
  - component: forgejo
    description: "Forgejo Git Service server (rootless image)"
    image: code.forgejo.org/forgejo/forgejo:15.0.10-rootless

  # ----------------------------------------------------------------------------
  # 7. CI/CD Runner - Forgejo Runner v12.7.3 (Step 05: 05-infra-apps/05-forgejo-runner)
  # ----------------------------------------------------------------------------
  - component: forgejo-runner
    description: "Forgejo Actions Runner daemon"
    image: code.forgejo.org/forgejo/runner:12.7.3

  - component: forgejo-runner-dind
    description: "Docker-in-Docker daemon sidecar for workflow container jobs"
    image: docker.io/docker:29.3.1-dind

  - component: forgejo-runner-kubectl
    description: "Kubectl helper image for runner hook jobs"
    image: docker.io/alpine/kubectl:1.35.3

  # ----------------------------------------------------------------------------
  # 8. Zabbix Monitoring Platform v7.4.15 (Step 05: 05-infra-apps/06-zabbix)
  # ----------------------------------------------------------------------------
  - component: zabbix-timescaledb
    description: "TimescaleDB PostgreSQL 16 time-series database backend for Zabbix"
    image: docker.io/timescale/timescaledb:2.17.2-pg16

  - component: zabbix-server
    description: "Zabbix Server daemon with PostgreSQL/TimescaleDB support"
    image: docker.io/zabbix/zabbix-server-pgsql:alpine-7.4.15

  - component: zabbix-web
    description: "Zabbix Web Frontend with Nginx and PostgreSQL driver"
    image: docker.io/zabbix/zabbix-web-nginx-pgsql:alpine-7.4.15

  - component: zabbix-proxy
    description: "Zabbix Proxy with SQLite3 database engine"
    image: docker.io/zabbix/zabbix-proxy-sqlite3:alpine-7.4.15

  - component: zabbix-snmptraps
    description: "Zabbix SNMP Traps daemon sidecar receiver"
    image: docker.io/zabbix/zabbix-snmptraps:alpine-7.4.15

  - component: zabbix-agent2
    description: "Zabbix Agent 2 monitoring daemon for Kubernetes nodes"
    image: docker.io/zabbix/zabbix-agent2:alpine-7.4.15

  - component: zabbix-kube-state-metrics
    description: "Kube-State-Metrics service for Zabbix Kubernetes cluster state monitoring"
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
