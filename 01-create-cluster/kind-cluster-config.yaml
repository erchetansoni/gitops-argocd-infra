kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-demo-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

      # For SNMP traps from external systems (hosts/clients) to the cluster (Zabbix, Nagios, etc.)
      - containerPort: 162
        hostPort: 162
        protocol: UDP

  # - role: control-plane
  # - role: worker
  # - role: worker
