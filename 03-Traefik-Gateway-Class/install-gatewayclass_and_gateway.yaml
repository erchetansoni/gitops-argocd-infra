# ============================================================
# MODERN KUBERNETES GATEWAY API LAB
# ============================================================

# ============================================================
# 1. GatewayClass
# ============================================================

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass

metadata:
  name: traefik

spec:
  controllerName: traefik.io/gateway-controller

---
# ============================================================
# 2. Gateway
# ============================================================

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: main-gateway
  namespace: default

spec:
  gatewayClassName: traefik

  listeners:
    # --------------------------------------------------------
    # HTTP listener (allows all hostnames for redirection)
    # --------------------------------------------------------
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # --------------------------------------------------------
    # HTTPS listener - chetan.local
    # --------------------------------------------------------
    - name: https-chetan
      protocol: HTTPS
      port: 443
      hostname: "*.chetan.local"
      tls:
        mode: Terminate
        certificateRefs:
          - name: domain-certificate-tls-secret
      allowedRoutes:
        namespaces:
          from: All

    # --------------------------------------------------------
    # HTTPS listener - dev environment (*.dev.chetan.local)
    # --------------------------------------------------------
    - name: https-dev
      protocol: HTTPS
      port: 443
      hostname: "*.dev.chetan.local"
      tls:
        mode: Terminate
        certificateRefs:
          - name: domain-certificate-tls-secret
      allowedRoutes:
        namespaces:
          from: All

    # # --------------------------------------------------------
    # # HTTPS listener - avgol.com
    # # --------------------------------------------------------
    # - name: https-avgol
    #   protocol: HTTPS
    #   port: 443
    #   hostname: "*.avgol.com"
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - name: avgol-com-tls
    #   allowedRoutes:
    #     namespaces:
    #       from: All

---
