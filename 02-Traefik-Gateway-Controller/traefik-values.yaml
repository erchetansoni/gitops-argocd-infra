deployment:
  enabled: true
  kind: DaemonSet

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  enabled: true
  spec:
    type: ClusterIP

# Do NOT use hostNetwork.
hostNetwork: false

ports:
  web:
    port: 80
    containerPort: 80
    hostPort: 80
    exposedPort: 80
    protocol: TCP
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    port: 443
    containerPort: 443
    hostPort: 443
    exposedPort: 443
    protocol: TCP

    http:
      tls:
        enabled: true

providers:
  kubernetesGateway:
    enabled: true

  # We are intentionally using Gateway API only.
  kubernetesCRD:
    enabled: false

  kubernetesIngress:
    enabled: false

gateway:
  enabled: false
  installCRDs: false # Explicitly tell Traefik that CRDs are managed independently

gatewayClass:
  enabled: false

ingressClass:
  enabled: false

securityContext:
  capabilities:
    drop:
      - ALL

    add:
      - NET_BIND_SERVICE

  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true

log:
  level: INFO

accessLog:
  enabled: true

additionalArguments:
  - "--serverstransport.insecureskipverify=true"
