# ============================================================
# Argo CD Private Git Repository Secret Template
# ============================================================
# Replace <YOUR_GITHUB_TOKEN> below with your GitHub Personal Access Token (PAT)
# Then apply: kubectl apply -f github-repo-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: repo-creds-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/erchetansoni/gitops-argocd-apps.git
  username: erchetansoni
  password: "<YOUR_GITHUB_TOKEN>"
