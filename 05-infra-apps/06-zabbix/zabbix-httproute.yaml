# ==============================================================================
# Zabbix Gateway API HTTPRoute
# Exposes Zabbix Web UI, Server endpoint, and Proxy hostname through main-gateway
# ==============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zabbix-route
  namespace: zabbix
spec:
  parentRefs:
    - name: main-gateway
      namespace: default

  hostnames:
    - "zabbix.chetan.local"
    - "zbx-srv.chetan.local"
    - "zbx-proxy.chetan.local"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zabbix-zabbix-web
          port: 80
