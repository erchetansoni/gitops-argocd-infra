# ============================================================
# Harbor Container Registry - Helm Values
# Subdomain: cr.chetan.local
# Gateway: main-gateway (Traefik Gateway API)
# ============================================================

expose:
  type: route
  tls:
    enabled: false
  route:
    parentRefs:
      - name: main-gateway
        namespace: default
    hosts:
      - cr.chetan.local

externalURL: https://cr.chetan.local

harborAdminPassword: "Harbor12345"

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      size: 10Gi
    jobservice:
      jobLog:
        size: 1Gi
    database:
      size: 1Gi
    redis:
      size: 1Gi
    trivy:
      size: 5Gi

ipFamily:
  ipv6:
    enabled: false

portal:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

core:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

jobservice:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

registry:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

database:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

trivy:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
