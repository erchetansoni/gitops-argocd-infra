apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.19.2
    helm:
      valuesObject:
        expose:
          type: route
          tls:
            enabled: false
          route:
            parentRefs:
              - name: main-gateway
                namespace: default
            hosts:
              - cr.chetan.local
        externalURL: https://cr.chetan.local
        harborAdminPassword: Harbor12345
        # The secret key used for encryption in PostgreSQL. MUST be exactly 16 characters.
        secretKey: HarborSecret1234
        persistence:
          enabled: true
          resourcePolicy: keep
          persistentVolumeClaim:
            # --- Registry PVC (Active: local filesystem storage) ---
            # NOTE: When switching to Object Storage below, comment out or remove this registry block.
            registry:
              size: 10Gi
            jobservice:
              jobLog:
                size: 1Gi
            database:
              size: 1Gi
            redis:
              size: 1Gi
            trivy:
              size: 5Gi

          # ============================================================================
          # OBJECT STORAGE OPTIONS (Uncomment ONE block below to move to object storage)
          # When enabling any object storage, comment out 'registry: size: 10Gi' above.
          # ============================================================================

          # --- Option 1: RustFS / MinIO / S3-Compatible Object Storage (Remote Server over HTTPS) ---
          # imageChartStorage:
          #   disableredirect: true
          #   type: s3
          #   s3:
          #     region: us-east-1
          #     regionendpoint: "https://rustfs.chetan.local"   # or "http://rustfs.default.svc.cluster.local:9000"
          #     bucket: "harbor-registry"
          #     accesskey: "YOUR_ACCESS_KEY"
          #     secretkey: "YOUR_SECRET_KEY"
          #     secure: true
          #     skipverify: true
          #     v4auth: true
          #     rootdirectory: "/"

          # --- Option 2: AWS S3 ---
          # imageChartStorage:
          #   disableredirect: false
          #   type: s3
          #   s3:
          #     region: "us-east-1"
          #     bucket: "my-harbor-registry-bucket"
          #     accesskey: "YOUR_AWS_ACCESS_KEY"
          #     secretkey: "YOUR_AWS_SECRET_KEY"
          #     secure: true
          #     v4auth: true
          #     rootdirectory: "/"

          # --- Option 3: Azure Blob Storage ---
          # imageChartStorage:
          #   disableredirect: false
          #   type: azure
          #   azure:
          #     accountname: "myazurestorageaccount"
          #     accountkey: "YOUR_AZURE_STORAGE_ACCOUNT_KEY"
          #     container: "harbor-registry"
          #     realm: "core.windows.net"
          #     storagePrefix: ""
        ipFamily:
          ipv6:
            enabled: false
        portal:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        core:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        jobservice:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        registry:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        database:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        redis:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        trivy:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
