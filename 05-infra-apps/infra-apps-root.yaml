apiVersion: v1
kind: List
metadata:
  name: infra-apps-root
items:
  # 1. Traefik Gateway Controller
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: traefik-gateway-controller
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://traefik.github.io/charts
        chart: traefik
        targetRevision: 41.6.0
        helm:
          releaseName: traefik
          skipCrds: true
          valuesObject:
            deployment:
              enabled: true
              kind: DaemonSet
            updateStrategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 1
                maxSurge: 0
            service:
              enabled: true
              spec:
                type: ClusterIP
            hostNetwork: false
            ports:
              web:
                port: 80
                containerPort: 80
                hostPort: 80
                exposedPort: 80
                protocol: TCP
                http:
                  redirections:
                    entryPoint:
                      to: websecure
                      scheme: https
                      permanent: true
              websecure:
                port: 443
                containerPort: 443
                hostPort: 443
                exposedPort: 443
                protocol: TCP
                http:
                  tls:
                    enabled: true
            providers:
              kubernetesGateway:
                enabled: true
              kubernetesCRD:
                enabled: false
              kubernetesIngress:
                enabled: false
            gateway:
              enabled: false
              installCRDs: false
            gatewayClass:
              enabled: false
            ingressClass:
              enabled: false
            securityContext:
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
            log:
              level: INFO
            accessLog:
              enabled: true
            additionalArguments:
              - "--serverstransport.insecureskipverify=true"
      destination:
        server: https://kubernetes.default.svc
        namespace: traefik
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

  # 2. Metrics Server
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: metrics-server
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://kubernetes-sigs.github.io/metrics-server/
        chart: metrics-server
        targetRevision: 3.14.0
        helm:
          valuesObject:
            args:
              - --cert-dir=/tmp
              - --secure-port=10250
              - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
              - --kubelet-use-node-status-port
              - --kubelet-insecure-tls
              - --metric-resolution=15s
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
      destination:
        server: https://kubernetes.default.svc
        namespace: kube-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

  # 3. Cert-Manager
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: cert-manager
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.21.2
        helm:
          valuesObject:
            crds:
              enabled: true
            extraArgs:
              - --enable-gateway-api
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
            webhook:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
            cainjector:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
      destination:
        server: https://kubernetes.default.svc
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

  # 4. Harbor Container Registry
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: harbor
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: default
      source:
        repoURL: https://helm.goharbor.io
        chart: harbor
        targetRevision: 1.19.2
        helm:
          valuesObject:
            expose:
              type: route
              tls:
                enabled: false
              route:
                parentRefs:
                  - name: main-gateway
                    namespace: default
                hosts:
                  - cr.chetan.local
            externalURL: https://cr.chetan.local
            harborAdminPassword: "Harbor12345"
            persistence:
              enabled: true
              resourcePolicy: keep
              persistentVolumeClaim:
                registry:
                  size: 10Gi
                jobservice:
                  jobLog:
                    size: 1Gi
                database:
                  size: 1Gi
                redis:
                  size: 1Gi
                trivy:
                  size: 5Gi
            ipFamily:
              ipv6:
                enabled: false
            portal:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
            core:
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
            jobservice:
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
            registry:
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
            database:
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
            redis:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
            trivy:
              enabled: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
      destination:
        server: https://kubernetes.default.svc
        namespace: harbor
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

