deployment:
  enabled: true
  kind: DaemonSet

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  enabled: true
  spec:
    type: ClusterIP # <---------------- # Change this to "LoadBalancer" for cloud load balancer Service in Traefik Gateway Controller on Cloud. Cloud provisions an AWS NLB or GCP LB
    # externalTrafficPolicy: Local      # Uncomment for cloud load balancer

    # Optional: Cloud annotations (e.g. for AWS NLB)
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: "external"
    #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"

# Do NOT use hostNetwork.
hostNetwork: false

ports:
  web:
    port: 80
    containerPort: 80
    hostPort: 80 # <-------------- Remove this when deploying on Cloud
    exposedPort: 80
    protocol: TCP
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    port: 443
    containerPort: 443
    hostPort: 443 # <---------------- Remove this when deploying on Cloud
    exposedPort: 443
    protocol: TCP

    http:
      tls:
        enabled: true

providers:
  kubernetesGateway:
    enabled: true

  # We are intentionally using Gateway API only.
  kubernetesCRD:
    enabled: false

  kubernetesIngress:
    enabled: false

gateway:
  enabled: false
  installCRDs: false # Explicitly tell Traefik that CRDs are managed independently

gatewayClass:
  enabled: false

ingressClass:
  enabled: false

securityContext:
  capabilities:
    drop:
      - ALL

    add:
      - NET_BIND_SERVICE

  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true

log:
  level: INFO

accessLog:
  enabled: true

additionalArguments:
  - "--serverstransport.insecureskipverify=true"
